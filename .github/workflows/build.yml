name: Build Desktop & Android Apps

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build EXE
        run: |
          npm install
          npx electron-builder --win nsis

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Desktop-Installer
          path: dist/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Capacitor CLI
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Generate Capacitor Project
        run: |
          echo '{"appId":"com.inventory.desk","appName":"Inventory Count Desk","webDir":".","bundledWebRuntime":false}' > capacitor.config.json
          npx cap add android

      - name: Build Android APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-File
          path: android/app/build/outputs/apk/debug/app-debug.apk
