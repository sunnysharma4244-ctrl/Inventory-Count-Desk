<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Count Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: linear-gradient(135deg, #f0f9ff 0%, #e6f4ea 100%); color: #0f172a; user-select: none; overflow: hidden; height: 100vh; }

        /* Activation Modal */
        #activationModal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #0284c7 100%);
            z-index: 9999; display: flex; justify-content: center; align-items: center;
        }
        .activation-card {
            background: #ffffff; padding: 32px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 380px; text-align: center;
        }
        .activation-card h2 { color: #0284c7; margin-bottom: 8px; font-size: 1.4rem; font-weight:800; }
        .activation-card p { font-size: 13px; color: #64748b; margin-bottom: 20px; line-height: 1.4; }
        .activation-card input {
            width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 8px;
            font-size: 18px; text-align: center; font-weight: 800; letter-spacing: 4px; outline: none; margin-bottom: 16px;
        }
        .activation-card input:focus { border-color: #0284c7; }
        .activation-card button {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #fff; font-size: 14px; font-weight: 700; border: none; border-radius: 8px; cursor: pointer;
        }

        /* Header UI */
        header { 
            background: linear-gradient(135deg, #0284c7 0%, #0d9488 100%); 
            padding: 8px 16px; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 2px solid #0369a1; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.2); 
            position: relative; z-index: 20; height: 60px; color: #ffffff;
        }

        .brand-container { display: flex; align-items: center; gap: 8px; }
        .app-brand-title { font-size: 1.1rem; font-weight: 800; color: #ffffff; letter-spacing: -0.01em; display: flex; align-items: center; gap: 6px; }

        .client-section {
            display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.18); 
            padding: 4px 12px; border-radius: 8px; border: 1px dashed rgba(255, 255, 255, 0.5);
        }
        .logo-box { width: 34px; height: 34px; background: rgba(255, 255, 255, 0.25); border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.5); transition: all 0.2s; }
        .logo-box:hover { background: rgba(255, 255, 255, 0.4); }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; }
        .logo-box svg { width: 18px; height: 18px; fill: none; stroke: #ffffff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
        
        .company-title-input { font-size: 0.95rem; font-weight: 700; color: #ffffff; border: none; background: transparent; outline: none; width: 200px; }
        .company-title-input::placeholder { color: rgba(255,255,255,0.7); }

        .main-actions-top { display: flex; align-items: center; gap: 8px; }
        .main-layout { display: flex; height: calc(100vh - 60px); width: 100vw; position: relative; }
        #canvas-container { flex: 1; height: 100%; position: relative; background: #cbd5e1; cursor: crosshair; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; }

        .sidebar { 
            width: 350px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); border-left: 1px solid #bae6fd; padding: 14px; 
            display: flex; flex-direction: column; gap: 12px; z-index: 10; height: 100%; overflow-y: auto; overflow-x: hidden;
        }

        .sub-toolbar { display: flex; gap: 8px; align-items: center; padding: 8px 16px; background: #f0f9ff; border-bottom: 1px solid #bae6fd; flex-wrap: wrap; }
        button, label { padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 6px; border: 1px solid #cbd5e1; color: #334155; background: #ffffff; display: inline-flex; align-items: center; gap: 4px; transition: all 0.2s; }
        label { background: linear-gradient(135deg, #0284c7, #0369a1); color: #ffffff; border: none; }
        button.btn-primary { background: linear-gradient(135deg, #0284c7, #0369a1); color: #fff; border: none; }
        button.btn-success { background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; border: none; }
        button.btn-dark { background: #0f172a; color: #fff; border: none; }

        .sidebar-section { background: rgba(240, 249, 255, 0.8); border: 1px solid #bae6fd; border-radius: 8px; padding: 12px; }
        .size-card { background: #ffffff; padding: 8px 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid #e0f2fe; margin-bottom: 6px; }
        .size-card.active { border-color: #0284c7; background: #e0f2fe; }
        .size-color-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; }

        .batch-card { background: #ffffff; border: 1px solid #e0f2fe; border-radius: 6px; overflow: hidden; font-size: 12px; margin-bottom: 6px; }
        .batch-header { padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: #f8fafc; border-bottom: 1px solid #f1f5f9; }
        .batch-body { padding: 6px 8px; background: #ffffff; display: none; border-top: 1px solid #e2e8f0; }
        .batch-body.open { display: block; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); z-index: 100; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #fff; border-radius: 10px; width: 600px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
        .modal-body { padding: 16px; overflow-y: auto; flex: 1; }

        table.summary-tbl { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 12px; }
        table.summary-tbl th, table.summary-tbl td { border: 1px solid #cbd5e1; padding: 8px 10px; text-align: left; }
        table.summary-tbl th { background: #f1f5f9; font-weight: 700; }
    </style>
</head>
<body>

    <!-- Activation Overlay -->
    <div id="activationModal">
        <div class="activation-card">
            <h2>🔒 Software Activation</h2>
            <p>Enter the First-Time Product Activation Key (8899) to open Inventory Count Desk.</p>
            <input type="password" id="licenseKeyInput" placeholder="Enter Password" maxlength="8">
            <button id="activateAppBtn">Activate Application</button>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="brand-container">
            <div class="app-brand-title">
                <span style="background:rgba(255,255,255,0.2); padding:4px 8px; border-radius:6px;">📦</span>
                <span>Inventory Count Desk</span>
            </div>
        </div>

        <div class="client-section" title="Upload Client Logo & Set Company Name">
            <input type="file" id="logoUploadInput" accept="image/*" style="display:none;">
            <div class="logo-box" id="logoBox" title="Click to upload client logo">
                <svg id="defaultLogoSvg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v10M7 12h10"></path><circle cx="12" cy="12" r="3" fill="#ffffff"></circle></svg>
                <img id="customLogoImg" style="display:none;" alt="Client Logo">
            </div>
            <div>
                <input type="text" id="companyNameInput" class="company-title-input" placeholder="Enter Client Company Name" value="Client Company Name">
            </div>
        </div>

        <div class="main-actions-top">
            <button id="savePartialBtn" class="btn-primary">💾 Partial Save</button>
            <button id="saveFinalBtn" class="btn-success">✅ Final Save All</button>
            <button id="viewReportBtn" style="background:#0284c7; color:#fff; border:none;">👁️ Summary</button>
            <button id="downloadExcelBtn" class="btn-dark">📊 Export Excel</button>
            <button id="downloadPdfBtn" style="background:#15803d; color:#fff; border:none;">📄 High-Res PDF</button>
            <button id="clearStorageBtn" style="color:#ef4444; border-color:#fca5a5; font-size:11px;">🗑 Clear Memory</button>
        </div>
    </header>

    <div class="sub-toolbar">
        <label for="imageInput">📷 Load Image</label>
        <input type="file" id="imageInput" accept="image/*" capture="environment" style="display:none;">
        
        <button id="undoBtn" disabled>↩ Undo</button>
        <button id="redoBtn" disabled>↪ Redo</button>
        <button id="deleteModeBtn">🗑 Delete: OFF</button>
        <button id="resetZoom">🎯 Reset View</button>
        <button id="clearAllBtn" style="color:#ef4444; border-color:#fca5a5;">⚡ Clear Canvas</button>

        <div style="margin-left:auto; font-weight:800; font-size:14px; color:#0284c7;">
            Total Active Count: <span id="totalCount">0</span>
        </div>
    </div>

    <div class="main-layout">
        <div id="canvas-container">
            <canvas id="pipeCanvas"></canvas>
        </div>

        <div class="sidebar">
            <div class="sidebar-section">
                <div style="font-size:12px; font-weight:800; color:#0284c7; margin-bottom:6px;">📍 Active Location / Vehicle</div>
                <input type="text" id="locValInput" value="Location 1" style="width:100%; padding:8px; font-size:12px; border:1px solid #cbd5e1; border-radius:6px; outline:none;">
            </div>

            <div class="sidebar-section">
                <div style="font-size:12px; font-weight:800; color:#0284c7; margin-bottom:8px;">🏷️ Item Categories Setup</div>
                <div style="display:flex; gap:6px; margin-bottom:8px;">
                    <input type="text" id="newSizeName" placeholder="Category Name" style="flex:1; padding:6px 8px; border-radius:6px; border:1px solid #cbd5e1; font-size:12px;">
                    <input type="color" id="newSizeColor" value="#0284c7" style="width:32px; height:32px; border-radius:6px; border:1px solid #cbd5e1; cursor:pointer;">
                    <button id="addSizeBtn" style="background:#0284c7; color:#fff; border:none;">Add</button>
                </div>
                <div id="sizesList"></div>
            </div>

            <div class="sidebar-section">
                <div style="font-size:12px; font-weight:800; color:#0284c7; margin-bottom:8px; display:flex; justify-content:space-between;">
                    <span>🗂️ Saved Audit Locations</span>
                    <span id="savedBatchesCount" style="background:#0284c7; color:#fff; padding:1px 6px; border-radius:8px; font-size:10px;">0</span>
                </div>
                <div id="batchesList"></div>
            </div>
        </div>
    </div>

    <!-- Summary Modal -->
    <div id="reportModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span>📋 Audit Summary Report</span>
                <button id="closeModalBtn" style="padding:2px 8px; border:none; background:#f1f5f9; font-size:14px; cursor:pointer;">✕</button>
            </div>
            <div class="modal-body" id="modalReportBody"></div>
        </div>
    </div>

    <script>
        // Activation Key Logic
        function checkActivation() {
            const isActivated = localStorage.getItem('inventory_app_activated');
            if (isActivated === 'true') {
                document.getElementById('activationModal').style.display = 'none';
            }
        }

        document.getElementById('activateAppBtn').onclick = () => {
            const pwd = document.getElementById('licenseKeyInput').value;
            if (pwd === '8899') {
                localStorage.setItem('inventory_app_activated', 'true');
                document.getElementById('activationModal').style.display = 'none';
                alert('Software Activated Successfully!');
            } else {
                alert('Invalid License Key! Please contact software seller.');
            }
        };

        checkActivation();

        const canvas = document.getElementById('pipeCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const totalCountDisplay = document.getElementById('totalCount');

        let img = new Image();
        let points = [];
        let historyStack = [], redoStack = [];
        let categories = [{ id: 1, name: 'Default Item Category', color: '#0284c7' }];
        let activeCategoryId = 1;
        let savedBatches = []; 
        let currentLoadedBatchId = null;

        let scale = 1, panX = 0, panY = 0;
        let isDragging = false, startX, startY, dragDistance = 0;
        let isDeleteMode = false;

        function init() {
            setupLogoUpload();
            loadLocalStorageData();
            renderCategories();
            renderBatches();
        }

        function setupLogoUpload() {
            const logoBox = document.getElementById('logoBox');
            const logoInput = document.getElementById('logoUploadInput');
            logoBox.onclick = () => logoInput.click();
            logoInput.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    document.getElementById('defaultLogoSvg').style.display = 'none';
                    const customImg = document.getElementById('customLogoImg');
                    customImg.src = evt.target.result;
                    customImg.style.display = 'block';
                    localStorage.setItem('inventory_custom_logo', evt.target.result);
                };
                reader.readAsDataURL(file);
            };

            const savedLogo = localStorage.getItem('inventory_custom_logo');
            if (savedLogo) {
                document.getElementById('defaultLogoSvg').style.display = 'none';
                const customImg = document.getElementById('customLogoImg');
                customImg.src = savedLogo;
                customImg.style.display = 'block';
            }

            const companyNameInput = document.getElementById('companyNameInput');
            const savedCompanyName = localStorage.getItem('inventory_company_name');
            if (savedCompanyName) companyNameInput.value = savedCompanyName;
            companyNameInput.onchange = () => localStorage.setItem('inventory_company_name', companyNameInput.value);
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem('inventory_saved_batches', JSON.stringify(savedBatches));
            } catch(e) {
                alert("Storage limit alert! Export report to clear space.");
            }
        }

        function loadLocalStorageData() {
            const rawData = localStorage.getItem('inventory_saved_batches');
            if (rawData) {
                try { savedBatches = JSON.parse(rawData); } catch(e) {}
            }
        }

        document.getElementById('addSizeBtn').onclick = () => {
            const name = document.getElementById('newSizeName').value.trim();
            const color = document.getElementById('newSizeColor').value;
            if (!name) return alert("Please enter Category Name!");
            const newCat = { id: Date.now(), name, color };
            categories.push(newCat);
            activeCategoryId = newCat.id;
            document.getElementById('newSizeName').value = '';
            renderCategories();
        };

        function renderCategories() {
            const sizesList = document.getElementById('sizesList');
            sizesList.innerHTML = '';

            categories.forEach(cat => {
                const count = points.filter(p => p.catId === cat.id).length;
                const card = document.createElement('div');
                card.className = `size-card ${cat.id === activeCategoryId ? 'active' : ''}`;
                card.onclick = () => { activeCategoryId = cat.id; renderCategories(); };
                
                card.innerHTML = `
                    <div style="display:flex; align-items:center;">
                        <span class="size-color-dot" style="background:${cat.color}"></span>
                        <strong style="font-size:12px; color:#334155;">${cat.name}</strong>
                    </div>
                    <span style="font-weight:700; background:#fff; padding:2px 8px; border-radius:10px; font-size:11px; color:${cat.color}; border:1px solid ${cat.color}44;">
                        ${count} pcs
                    </span>
                `;
                sizesList.appendChild(card);
            });
            totalCountDisplay.innerText = points.length;
            draw();
        }

        document.getElementById('imageInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    scale = container.clientWidth / img.width;
                    panX = (container.clientWidth - img.width * scale) / 2;
                    panY = (container.clientHeight - img.height * scale) / 2;
                    draw();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (img.src) {
                ctx.drawImage(img, 0, 0);
            }

            const dynamicRadius = 14 / scale;
            let catCounters = {};

            points.forEach((pt) => {
                if (!catCounters[pt.catId]) catCounters[pt.catId] = 0;
                catCounters[pt.catId]++;
                const categoryIndex = catCounters[pt.catId];
                const cat = categories.find(c => c.id === pt.catId) || categories[0];

                ctx.save();
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, dynamicRadius, 0, Math.PI * 2);
                ctx.fillStyle = cat.color;
                ctx.fill();
                ctx.lineWidth = Math.max(1.5, 2 / scale);
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${Math.max(10, dynamicRadius * 0.85)}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(categoryIndex, pt.x, pt.y);
                ctx.restore();
            });

            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            canvas.style.transformOrigin = '0 0';
        }

        container.addEventListener('wheel', (e) => {
            if (!img.src) return;
            e.preventDefault();
            const zoomFactor = 1.1;
            const mouseX = e.clientX - container.offsetLeft;
            const mouseY = e.clientY - container.offsetTop;

            let newScale = e.deltaY < 0 ? scale * zoomFactor : scale / zoomFactor;
            newScale = Math.min(Math.max(0.1, newScale), 15);

            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            scale = newScale;
            draw();
        }, { passive: false });

        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
            dragDistance = 0;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            dragDistance += Math.hypot(e.movementX, e.movementY);
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            draw();
        });

        window.addEventListener('mouseup', (e) => {
            if (isDragging && dragDistance < 5) handleCanvasClick(e);
            isDragging = false;
        });

        function handleCanvasClick(e) {
            if (!img.src) return;
            const rect = canvas.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) / scale;
            const clickY = (e.clientY - rect.top) / scale;

            const hitRadius = 18 / scale;
            const existingIndex = points.findIndex(pt => Math.hypot(pt.x - clickX, pt.y - clickY) < hitRadius);

            if (isDeleteMode || e.shiftKey) {
                if (existingIndex !== -1) {
                    points.splice(existingIndex, 1);
                }
            } else {
                if (existingIndex === -1) {
                    points.push({ x: clickX, y: clickY, catId: activeCategoryId });
                }
            }
            renderCategories();
        }

        document.getElementById('deleteModeBtn').onclick = () => {
            isDeleteMode = !isDeleteMode;
            document.getElementById('deleteModeBtn').innerText = isDeleteMode ? "🗑 Delete: ON" : "🗑 Delete: OFF";
            document.getElementById('deleteModeBtn').style.background = isDeleteMode ? "#ef4444" : "#ffffff";
            document.getElementById('deleteModeBtn').style.color = isDeleteMode ? "#ffffff" : "#334155";
        };

        document.getElementById('resetZoom').onclick = () => {
            if (!img.src) return;
            scale = container.clientWidth / img.width;
            panX = (container.clientWidth - img.width * scale) / 2;
            panY = (container.clientHeight - img.height * scale) / 2;
            draw();
        };

        document.getElementById('clearAllBtn').onclick = () => {
            if (confirm("Clear canvas markings?")) {
                points = [];
                draw();
                renderCategories();
            }
        };

        // Partial & Final Save Logic
        document.getElementById('savePartialBtn').onclick = () => {
            const locName = document.getElementById('locValInput').value.trim() || 'General Location';
            if (points.length === 0) return alert("Please mark points on image first!");

            const batchSummary = categories.map(c => ({ catId: c.id, catName: c.name, count: points.filter(p => p.catId === c.id).length }));
            const imageSnapshot = canvas.toDataURL('image/jpeg', 0.95);

            if (currentLoadedBatchId) {
                const bIdx = savedBatches.findIndex(b => b.id === currentLoadedBatchId);
                if (bIdx !== -1) {
                    savedBatches[bIdx].location = locName;
                    savedBatches[bIdx].totalCount = points.length;
                    savedBatches[bIdx].breakdown = batchSummary;
                    savedBatches[bIdx].rawPoints = JSON.parse(JSON.stringify(points));
                    savedBatches[bIdx].categories = JSON.parse(JSON.stringify(categories));
                    savedBatches[bIdx].imageData = imageSnapshot;
                }
            } else {
                savedBatches.push({
                    id: Date.now(),
                    location: locName,
                    timestamp: new Date().toLocaleString(),
                    totalCount: points.length,
                    breakdown: batchSummary,
                    rawPoints: JSON.parse(JSON.stringify(points)),
                    categories: JSON.parse(JSON.stringify(categories)),
                    rawImageSrc: img.src,
                    imageData: imageSnapshot
                });
            }

            saveToLocalStorage();
            points = [];
            currentLoadedBatchId = null;
            document.getElementById('locValInput').value = `Location ${savedBatches.length + 1}`;
            renderCategories();
            renderBatches();
            alert(`Location "${locName}" saved successfully!`);
        };

        function renderBatches() {
            const list = document.getElementById('batchesList');
            list.innerHTML = '';
            document.getElementById('savedBatchesCount').innerText = savedBatches.length;

            savedBatches.forEach((b) => {
                const card = document.createElement('div');
                card.className = 'batch-card';
                card.innerHTML = `
                    <div class="batch-header">
                        <div>
                            <strong>${b.location}</strong>
                            <div style="font-size:10px; color:#64748b;">${b.timestamp}</div>
                        </div>
                        <div style="display:flex; gap:6px; align-items:center;">
                            <span style="font-weight:700; background:#e0f2fe; color:#0369a1; padding:2px 6px; border-radius:10px; font-size:11px;">${b.totalCount} pcs</span>
                            <button onclick="loadBatchForEdit(${b.id})" style="padding:2px 6px; font-size:10px; border-radius:4px; border:1px solid #0284c7; background:#0284c7; color:#fff;">Resume</button>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function loadBatchForEdit(batchId) {
            const batch = savedBatches.find(b => b.id === batchId);
            if (!batch) return;

            document.getElementById('locValInput').value = batch.location;
            points = JSON.parse(JSON.stringify(batch.rawPoints || []));
            if (batch.categories) {
                batch.categories.forEach(bCat => {
                    if (!categories.some(c => c.id === bCat.id)) categories.push(bCat);
                });
            }
            currentLoadedBatchId = batch.id;

            if (batch.rawImageSrc) {
                img = new Image();
                img.onload = () => {
                    scale = container.clientWidth / img.width;
                    panX = (container.clientWidth - img.width * scale) / 2;
                    panY = (container.clientHeight - img.height * scale) / 2;
                    renderCategories();
                };
                img.src = batch.rawImageSrc;
            } else {
                renderCategories();
            }
        }

        // 100% Native Fail-Safe Excel Export (Works without external CDN)
        document.getElementById('downloadExcelBtn').onclick = () => {
            if (savedBatches.length === 0 && points.length === 0) return alert("No saved count records to export!");

            const compName = localStorage.getItem('inventory_company_name') || 'Client Company';
            let tableHTML = `<table border="1">
                <tr><th colspan="4" style="background-color:#0284c7; color:#ffffff; font-size:16px;">${compName.toUpperCase()} - INVENTORY AUDIT REPORT</th></tr>
                <tr><th>Location</th><th>Date/Time</th><th>Category Breakdown</th><th>Total Items (Pcs)</th></tr>`;

            let grandTotal = 0;
            savedBatches.forEach(b => {
                grandTotal += b.totalCount;
                let breakdownStr = b.breakdown.map(i => `${i.catName}: ${i.count} pcs`).join(', ');
                tableHTML += `<tr><td>${b.location}</td><td>${b.timestamp}</td><td>${breakdownStr}</td><td>${b.totalCount}</td></tr>`;
            });

            tableHTML += `<tr style="font-weight:bold; background-color:#e0f2fe;">
                <td colspan="3">GRAND TOTAL</td><td>${grandTotal} Pcs</td>
            </tr></table>`;

            const blob = new Blob([tableHTML], { type: 'application/vnd.ms-excel' });
            const downloadUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `Inventory_Report_${new Date().toISOString().slice(0,10)}.xls`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        // High Quality Full-Resolution PDF Generator
        document.getElementById('downloadPdfBtn').onclick = () => {
            if (savedBatches.length === 0 && points.length === 0) return alert("No saved data to print PDF!");

            const compName = localStorage.getItem('inventory_company_name') || 'Client Company Name';
            const clientLogoSrc = localStorage.getItem('inventory_custom_logo') || '';

            let pdfHTML = `
            <!DOCTYPE html>
            <html>
            <head>
                <title>${compName} - Inventory Audit Report</title>
                <style>
                    body { font-family: 'Plus Jakarta Sans', Arial, sans-serif; padding: 25px; color: #0f172a; font-size: 14px; line-height: 1.5; }
                    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #0284c7; padding-bottom: 12px; margin-bottom: 20px; }
                    .header h1 { margin: 0; color: #0284c7; font-size: 22px; text-transform: uppercase; }
                    .logo { max-height: 60px; max-width: 140px; border-radius: 6px; }
                    .location-block { background: #ffffff; border: 2px solid #cbd5e1; border-radius: 10px; padding: 18px; margin-bottom: 25px; page-break-inside: avoid; }
                    .location-title { font-size: 16px; font-weight: 800; color: #0284c7; margin-bottom: 8px; }
                    .img-container { text-align: center; margin-top: 12px; }
                    .img-container img { width: 100%; max-height: 500px; object-fit: contain; border-radius: 8px; border: 1px solid #cbd5e1; }
                    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
                    th, td { border: 1px solid #cbd5e1; padding: 8px 12px; text-align: left; }
                    th { background: #f1f5f9; font-weight: 700; }
                </style>
            </head>
            <body>
                <div class="header">
                    <div>
                        <h1>${compName}</h1>
                        <p style="margin:4px 0 0 0; color:#64748b; font-weight:600;">INVENTORY COUNT AUDIT REPORT</p>
                        <p style="margin:2px 0 0 0; font-size:12px; color:#94a3b8;">Generated: ${new Date().toLocaleString()}</p>
                    </div>
                    ${clientLogoSrc ? `<img src="${clientLogoSrc}" class="logo">` : ''}
                </div>
            `;

            savedBatches.forEach((b, i) => {
                pdfHTML += `
                <div class="location-block">
                    <div class="location-title">Location #${i+1}: ${b.location} (${b.timestamp})</div>
                    <p style="font-weight:700;">Total Item Count: <span style="color:#0284c7;">${b.totalCount} pcs</span></p>
                    <table>
                        <tr><th>Category</th><th>Counted Quantity</th></tr>
                        ${b.breakdown.map(item => item.count > 0 ? `<tr><td>${item.catName}</td><td><strong>${item.count} pcs</strong></td></tr>` : '').join('')}
                    </table>
                    ${b.imageData ? `<div class="img-container"><img src="${b.imageData}"></div>` : ''}
                </div>`;
            });

            pdfHTML += `</body></html>`;

            const printWin = window.open('', '_blank');
            printWin.document.write(pdfHTML);
            printWin.document.close();
            printWin.focus();
            setTimeout(() => { printWin.print(); }, 500);
        };

        init();
    </script>
</body>
</html>
